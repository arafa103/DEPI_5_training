<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Theme Preview</title>
    <link rel="icon" href="icons/letter-s.png">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Guides&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <!-- stylesheet -->
     <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <nav>
        <div class="wrapper">
            <div class="brand">
                <a href="">Brand Name</a>
            </div>
            <div class="navigation">
                <ul>
                    <li><a href="">PORTFOLIO</a></li>
                    <li><a href="">ABOUT</a></li>
                    <li><a href="">CONTACT</a></li>
                </ul>
            </div>
            <div class="clearfix"></div>
        </div>
    </nav>
    <!-- header -->
     <!-- splitter: div>hr+i+hr , hr+:before(circle)+:after(icon)-->
     <header>
        <div class="wrapper">
            <img src="images/avataaars.svg" alt="avatar">
            <h1>Start Bootstrap</h1>
            <div class="splitter">
                <hr>
                <i class="fa-solid fa-star"></i>
                <hr>
            </div>
            <p>Graphic Artist - Web Designer - Illustrator</p>
        </div>
     </header>
     <section id="one">
        <div class="wrapper">
            <img src="images/avataaars.svg" alt="avatar">
            <h1>Start Bootstrap</h1>
            <div class="splitter">
                <div class="hr"></div>
            </div>
            <p>Graphic Artist - Web Designer - Illustrator</p>
        </div>
     </section>
</body>
</html>
